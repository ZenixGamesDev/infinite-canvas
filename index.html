<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Infinite Canvas</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем стабильную версию Three.js прямо сюда -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <canvas id="infiniteCanvas"></canvas>

    <div class="top-bar">
        <div class="coordinates" aria-label="Current canvas coordinates">
            <span>X: <strong id="coordinateX">0</strong></span>
            <span>Y: <strong id="coordinateY">0</strong></span>
        </div>
    </div>

    <button id="createObjectButton" class="create-object-button" type="button" aria-label="Create a new object">
        Create Object
    </button>

    <script src="app.js"></script>
</body>
</html>
